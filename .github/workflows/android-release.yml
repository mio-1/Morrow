name: Android APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          manifest = ET.parse('app/src/main/AndroidManifest.xml').getroot()
          version = manifest.attrib['{http://schemas.android.com/apk/res/android}versionName']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and APK version differ'
          PY
      - run: npm test
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MORROW_KEYSTORE_BASE64 }}
          MORROW_KEYSTORE_PASSWORD: ${{ secrets.MORROW_KEYSTORE_PASSWORD }}
          MORROW_KEY_ALIAS: ${{ secrets.MORROW_KEY_ALIAS }}
          MORROW_KEY_PASSWORD: ${{ secrets.MORROW_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$MORROW_KEYSTORE_PASSWORD"
          test -n "$MORROW_KEY_ALIAS"
          test -n "$MORROW_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/morrow-signing.jks"
          chmod 600 "$RUNNER_TEMP/morrow-signing.jks"
          echo "MORROW_SIGNING_KEY=$RUNNER_TEMP/morrow-signing.jks" >> "$GITHUB_ENV"
      - name: Build and verify APK
        env:
          MORROW_KEYSTORE_PASSWORD: ${{ secrets.MORROW_KEYSTORE_PASSWORD }}
          MORROW_KEY_ALIAS: ${{ secrets.MORROW_KEY_ALIAS }}
          MORROW_KEY_PASSWORD: ${{ secrets.MORROW_KEY_PASSWORD }}
        run: npm run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: morrow-android
          path: |
            dist/*.apk
            dist/SHA256.txt
            dist/build-info.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: morrow-android
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256.txt dist/build-info.json --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
